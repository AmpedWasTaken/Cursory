<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Cost per successful task">
  <rect width="100%" height="100%" fill="#0a0a0a"/>
  <rect x="12" y="12" width="696" height="236" rx="16" fill="#141414" stroke="#262626" stroke-width="1"/>
  
  <text x="28" y="40" font-size="18" font-weight="700" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, sans-serif">Cost per successful task</text>
  <text x="28" y="58" font-size="12" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif">estimated · not Cursor billing · efficiency, not just token count</text>
  
  <text x="40" y="100" font-size="12" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif">Mode</text>
  <text x="220" y="100" font-size="12" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif">Avg cost</text>
  <text x="380" y="100" font-size="12" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif">Pass rate</text>
  <text x="520" y="100" font-size="12" fill="#a3a3a3" font-family="ui-sans-serif, system-ui, sans-serif">Cost / success</text>
  <line x1="36" y1="112" x2="684" y2="112" stroke="#262626"/>
  
  <text x="40" y="140" font-size="15" font-weight="600" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif">Cursor</text>
  <text x="220" y="140" font-size="15" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, sans-serif">$0.089</text>
  <text x="380" y="140" font-size="15" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, sans-serif">100%</text>
  <text x="520" y="140" font-size="15" font-weight="700" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, sans-serif">$0.089</text>

  <text x="40" y="176" font-size="15" font-weight="600" fill="#2dd4bf" font-family="ui-sans-serif, system-ui, sans-serif">Cursory</text>
  <text x="220" y="176" font-size="15" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, sans-serif">$0.072</text>
  <text x="380" y="176" font-size="15" fill="#f5f5f5" font-family="ui-sans-serif, system-ui, sans-serif">100%</text>
